<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Kaushalya</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎓</text></svg>" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body
  style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--cream);">

  <div style="width:100%;max-width:440px;">
    <a href="./index.html" style="display:block;text-align:center;margin-bottom:32px;">
      <span style="font-family:var(--ff-display);font-size:1.6rem;font-weight:700;color:var(--ink);">Kaushal<span
          style="color:var(--amber);">ya</span></span>
    </a>

    <div class="card">
      <div style="text-align:center;margin-bottom:28px;">
        <div style="font-size:2.8rem;margin-bottom:14px;">🔑</div>
        <h1 style="font-family:var(--ff-display);font-size:1.6rem;font-weight:700;color:var(--ink);margin-bottom:6px;">
          Reset your password</h1>
        <p style="font-size:0.875rem;color:var(--muted);">Enter the token from your email and choose a new password.</p>
      </div>

      <div id="alert-area"></div>

      <form id="reset-form" novalidate style="display:flex;flex-direction:column;gap:18px;">
        <div class="form-group">
          <label class="form-label" for="token">Reset Token</label>
          <input type="text" id="token" class="form-input" placeholder="Paste your reset token here"
            autocomplete="off" />
          <span class="form-hint">Check your server console / email for the token.</span>
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="new-password">New Password</label>
          <div style="position:relative;">
            <input type="password" id="new-password" class="form-input" placeholder="Min. 6 characters"
              style="padding-right:48px;" autocomplete="new-password" />
            <button type="button" id="toggle-pass"
              style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;"
              tabindex="-1">👁</button>
          </div>
          <div id="strength-meter"></div>
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm New Password</label>
          <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter your new password"
            autocomplete="new-password" />
          <span class="field-error"></span>
        </div>

        <button type="submit" class="btn btn-primary w-full btn-lg" id="submit-btn">Reset Password</button>
      </form>

      <div style="text-align:center;margin-top:20px;font-size:0.875rem;color:var(--muted);">
        <a href="./login.html" style="color:var(--amber);font-weight:500;">← Back to login</a>
        &nbsp;·&nbsp;
        <a href="./forgot-password.html" style="color:var(--amber);font-weight:500;">Resend token</a>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Pre-fill token from URL ?token=...
      const params = new URLSearchParams(window.location.search);
      if (params.get('token')) document.getElementById('token').value = params.get('token');

      // Password strength
      initPasswordStrength('new-password', 'strength-meter');

      // Toggle password visibility
      document.getElementById('toggle-pass').addEventListener('click', () => {
        const p = document.getElementById('new-password');
        p.type = p.type === 'password' ? 'text' : 'password';
      });

      // Inline validation
      const tokenInput = document.getElementById('token');
      const newPassInput = document.getElementById('new-password');
      const confirmPassInput = document.getElementById('confirm-password');

      tokenInput.addEventListener('blur', () => validateField(tokenInput, { required: true, requiredMsg: 'Token is required.' }));
      newPassInput.addEventListener('blur', () => validateField(newPassInput, { required: true, minLength: 6, minLengthMsg: 'Password must be at least 6 characters.' }));
      confirmPassInput.addEventListener('blur', () => validateField(confirmPassInput, { required: true, match: () => newPassInput.value, matchMsg: 'Passwords do not match.' }));

      document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertEl = document.getElementById('alert-area');
        alertEl.innerHTML = '';

        const token = tokenInput.value.trim();
        const newPassword = newPassInput.value;
        const confirm = confirmPassInput.value;

        // Validate all
        const v1 = validateField(tokenInput, { required: true, requiredMsg: 'Token is required.' });
        const v2 = validateField(newPassInput, { required: true, minLength: 6, minLengthMsg: 'Password must be at least 6 characters.' });
        const v3 = validateField(confirmPassInput, { required: true, match: () => newPassInput.value, matchMsg: 'Passwords do not match.' });
        if (!v1 || !v2 || !v3) return;

        if (newPassword !== confirm) {
          alertEl.innerHTML = `<div class="alert alert-error mb-16">Passwords do not match.</div>`;
          return;
        }

        const btn = document.getElementById('submit-btn');
        setLoading(btn, true);

        const { ok, data } = await apiFetch('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token, newPassword })
        });

        setLoading(btn, false, 'Reset Password');

        if (ok && data.success) {
          alertEl.innerHTML = `<div class="alert alert-success mb-16">✓ Password reset successfully!</div>`;
          Toast.success('Password updated! Redirecting to login…');
          setTimeout(() => window.location.href = './login.html', 1800);
        } else {
          alertEl.innerHTML = `<div class="alert alert-error mb-16">⚠ ${data.message || 'Reset failed. Token may be invalid or expired.'}</div>`;
        }
      });
    });
  </script>
</body>

</html>
