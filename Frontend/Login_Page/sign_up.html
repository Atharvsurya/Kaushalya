<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaushalya </title>
    <link rel="stylesheet" href="sign_up.css">
    <link rel="icon" type="image/ico" href="/Frontend/favicon.icovicon.ico">
</head>
<body>
<div class="container">
    <h3>SIGN UP</h3>
    <form>
        <label>
            <div class="input-option">
                <label for="input">Name:</label>
                <input type="text" name="name">
            </div>
        </label>
        <label>
            <div class="input-option">
                <label for="input">Email:</label>
                <input type="text" name="email">
            </div>
        </label>
        <label>
            <div class="input-option">
                <label for="input">DOB:</label>
                <input type="date" name="bday">
            </div>
        </label>
        <label>
            <div class="input-option">
                <label for="input">Password:</label>
                <input type="password" name="pass">
            </div>
        </label>
        <label>
            <div class="input-option">
                <label for="input">Confirm Password:</label>
                <input type="password" name="cpass">
            </div>
        </label>
        <button type="submit">Sign Up</button>
    </form>
    <div class="existing">
        <p>Already have an account? <a href="sign_in.html">Sign In</a></p>
    </div>
</div>
</body>
