<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaushalya </title>
    <link rel="stylesheet" href="./sign_in.css">
    <link rel="icon" type="image/ico" href="/static/Frontend/favicon.icovicon.ico">
</head>
<body>
<div class="header">
<div class="container">
    <h3>SIGN IN</h3>
    <form id="LoginForm">
        <label>
            <div class="input-option">
                <label for="email">Email:</label>
                <input type="text" name="email" id="email">
            </div>
        </label>
        <label>
            <div class="input-option">
                <label for="password">Password:</label>
                <input type="password" name="password" id="password">
            </div>
        </label>
        <button type="button" id="loginBtn">Continue</button>
    </form>
    <div class="new">
        <a href="./sign_up.html">New user?</a>
    </div>
    <div class="forgot">
        <a href="./forgot_pass.html">Forgot Password?</a>
    </div>
</div>
<script src="./sign_in.js"></script>
</body>
</html>
