<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaushalya Login</title>
<link rel="stylesheet" href="login.css">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<div class="container">

    <h1 class="logo">KAUSHALYA</h1>
    <p class="tagline">Reviving Roots, Empowering Futures</p>

    <div class="login-box">

        <h2>Login to Kaushalya</h2>
        <p class="subtext">Enter your credentials to access your account !</p>

        <form>

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" placeholder="Email">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Password">
                <i class="fa-solid fa-eye eye"></i>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox"> Remember me
                </label>

                <a href="#">Forget Password?</a>
            </div>

            <button class="login-btn">Login</button>

            <p class="signup">
                Don’t have an account?
                <a href="#">Sign Up</a>
            </p>

        </form>

    </div>

    <div class="footer">
        <i class="fa-solid fa-lock"></i>
        Secure Policy • Terms of Service
    </div>

</div>

</body>
</html>
