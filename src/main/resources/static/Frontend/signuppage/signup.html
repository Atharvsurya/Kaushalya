<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaushalya Sign Up</title>

<link rel="stylesheet" href="signup.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="container">

<h1 class="logo">KAUSHALYA</h1>

<p class="tagline">Reviving Roots, Empowering Futures</p>

<div class="card">
<h2>Sign Up for Kaushalya</h2>

<p class="subtext">Create an account to start learning journey!</p>

<div class="input-box">
<i class="fa fa-user"></i>
<input type="text" placeholder="Full Name">
</div>

<div class="input-box">
<i class="fa fa-envelope"></i>
<input type="email" placeholder="Email">
</div>

<div class="input-box">
<i class="fa fa-lock"></i>
<input type="password" id="pass" placeholder="Password">
<i class="fa fa-eye eye"></i>
</div>

<div class="input-box">
<i class="fa fa-lock"></i>
<input type="password" id="cpass" placeholder="Confirm Password">
<i class="fa fa-eye eye"></i>
</div>


<div class="terms">
<input type="checkbox">
<label>I agree to the Terms of Service and Privacy Policy</label>
</div>

<button class="btn">Sign Up</button>

</div>

</div>

<footer>

<i class="fa fa-lock"></i> Secure Policy  •  Terms of Service

</footer>

<script src="signup.js"></script>
</body>
</html>
