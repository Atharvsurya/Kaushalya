<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Kaushalya</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎓</text></svg>" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
<div style="width:100%;max-width:440px;">
  <a href="../index.html" style="display:block;text-align:center;margin-bottom:28px;">
    <span style="font-family:var(--ff-display);font-size:1.5rem;font-weight:700;color:var(--ink);">Kaushal<span style="color:var(--amber);">ya</span></span>
  </a>

  <!-- Forgot form -->
  <div class="card" id="forgot-card">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="font-size:2.5rem;margin-bottom:12px;">🔐</div>
      <h1 style="font-family:var(--ff-display);font-size:1.6rem;font-weight:700;color:var(--ink);margin-bottom:6px;">Forgot your password?</h1>
      <p style="font-size:0.875rem;color:var(--muted);">Enter your email and we'll send you a reset token.</p>
    </div>

    <div id="forgot-alert"></div>

    <form class="auth-form" id="forgot-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required />
      </div>
      <button type="submit" class="btn btn-primary w-full btn-lg" id="forgot-btn">Send Reset Token</button>
    </form>

    <div class="auth-footer mt-16">
      <a href="./login.html" style="color:var(--amber);font-weight:500;">← Back to login</a>
    </div>
  </div>

  <!-- Reset form (shown after token received) -->
  <div class="card" id="reset-card" style="display:none;">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="font-size:2.5rem;margin-bottom:12px;">✉️</div>
      <h1 style="font-family:var(--ff-display);font-size:1.6rem;font-weight:700;color:var(--ink);margin-bottom:6px;">Reset your password</h1>
      <p style="font-size:0.875rem;color:var(--muted);">Enter the reset token you received and your new password.</p>
    </div>

    <div id="reset-alert"></div>

    <form class="auth-form" id="reset-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="token">Reset Token</label>
        <input type="text" id="token" class="form-input" placeholder="Paste your token here" required />
        <span class="form-hint">Check your email or the server logs for the token.</span>
      </div>
      <div class="form-group">
        <label class="form-label" for="new-password">New Password</label>
        <input type="password" id="new-password" class="form-input" placeholder="Min. 6 characters" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter new password" required />
      </div>
      <button type="submit" class="btn btn-primary w-full btn-lg" id="reset-btn">Reset Password</button>
    </form>

    <div class="auth-footer mt-16">
      <a href="./login.html" style="color:var(--amber);font-weight:500;">← Back to login</a>
    </div>
  </div>
</div>

<script src="./app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Check if token is in URL
  const params = new URLSearchParams(window.location.search);
  if (params.get('token')) {
    document.getElementById('forgot-card').style.display = 'none';
    document.getElementById('reset-card').style.display = 'block';
    document.getElementById('token').value = params.get('token');
  }

  // Forgot form
  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertEl = document.getElementById('forgot-alert');
    alertEl.innerHTML = '';
    const email = document.getElementById('email').value.trim();
    if (!email) { alertEl.innerHTML = `<div class="alert alert-error mb-16">Email is required.</div>`; return; }

    const btn = document.getElementById('forgot-btn');
    setLoading(btn, true);
    const { ok, data } = await apiFetch('/auth/forgot-password', {
      method: 'POST', body: JSON.stringify({ email })
    });
    setLoading(btn, false, 'Send Reset Token');

    if (ok && data.success) {
      alertEl.innerHTML = `<div class="alert alert-success mb-16">✓ Reset token generated! In production this would be emailed to you. For now, check the server logs or use <strong>GET /api/admin/users</strong> to find the token.</div>`;
      setTimeout(() => {
        document.getElementById('forgot-card').style.display = 'none';
        document.getElementById('reset-card').style.display = 'block';
      }, 2000);
    } else {
      alertEl.innerHTML = `<div class="alert alert-error mb-16">⚠ ${data.message || 'Request failed.'}</div>`;
    }
  });

  // Reset form
  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertEl = document.getElementById('reset-alert');
    alertEl.innerHTML = '';

    const token = document.getElementById('token').value.trim();
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    if (!token) { alertEl.innerHTML = `<div class="alert alert-error mb-16">Token is required.</div>`; return; }
    if (newPassword.length < 6) { alertEl.innerHTML = `<div class="alert alert-error mb-16">Password must be at least 6 characters.</div>`; return; }
    if (newPassword !== confirmPassword) { alertEl.innerHTML = `<div class="alert alert-error mb-16">Passwords do not match.</div>`; return; }

    const btn = document.getElementById('reset-btn');
    setLoading(btn, true);
    const { ok, data } = await apiFetch('/auth/reset-password', {
      method: 'POST', body: JSON.stringify({ token, newPassword })
    });
    setLoading(btn, false, 'Reset Password');

    if (ok && data.success) {
      alertEl.innerHTML = `<div class="alert alert-success mb-16">✓ Password reset successfully!</div>`;
      Toast.success('Password updated! Redirecting to login…');
      setTimeout(() => window.location.href = './login.html', 1500);
    } else {
      alertEl.innerHTML = `<div class="alert alert-error mb-16">⚠ ${data.message || 'Reset failed. Token may be invalid or expired.'}</div>`;
    }
  });
});
</script>
</body>
</html>
