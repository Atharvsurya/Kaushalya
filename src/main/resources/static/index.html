<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kaushalya Splash</title>

<style>

/* Reset */
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Georgia, serif;
    background-color:black;
}

/* Background Image */
.bg-container{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-image:url("Frontend/images/BG-kaus.png");
    background-size:cover;        /* cover full screen */
    background-position:center;
    background-repeat:no-repeat;
    opacity:0.75;                 /* 75% opacity */
    z-index:-1;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

/* Splash container */
.splash{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    gap:25px;
}

/* Logo */
.logo-box img{
    width:300px;
    height: 300px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

/* Typing text */
.typing{
    font-size:clamp(32px,7vw,65px);
    font-weight:bold;
    color:white;
    letter-spacing:6px;
    border-right:3px solid white;
    white-space:nowrap;
    overflow:hidden;
    text-shadow:0 0 15px rgba(0,0,0,0.9);
}

/* Fade animation */
.splash.fade-out{
    opacity:0;
    transition:opacity 2s ease;
}

</style>

</head>

<body>

<!-- Background -->
<div class="bg-container"></div>

<!-- Splash Content -->
<div class="splash" id="splash">

    <div class="logo-box">
        <img src="Frontend/images/Kaus-logo.png" alt="Kaushalya Logo">
    </div>

    <div class="typing" id="typing-text"></div>

</div>

<script>

const text = "KAUSHALYA";
let i = 0;
const speed = 170;
const typingElement = document.getElementById("typing-text");

function typeWriter(){

    if(i < text.length){
        typingElement.textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
    }

    else{

        setTimeout(()=>{

            document.getElementById("splash").classList.add("fade-out");

            setTimeout(()=>{
                window.location.replace("/Frontend/homepage/home.html");
            },1000);

        },1000);

    }

}

window.addEventListener("load", typeWriter);

</script>

</body>
</html>
