<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — Kaushalya</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎓</text></svg>" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    .profile-hero {
      background: var(--ink-soft); padding: 48px 0;
    }
    .profile-header {
      display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap;
    }
    .profile-avatar-wrap {
      width: 96px; height: 96px; flex-shrink: 0;
    }
    .profile-avatar-large {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--amber); color: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--ff-display); font-size: 2.2rem; font-weight: 700;
      border: 3px solid rgba(255,255,255,0.2);
    }
    .profile-info h1 { font-family: var(--ff-display); font-size: 1.8rem; color: var(--white); font-weight: 700; }
    .profile-info p { color: rgba(255,255,255,0.5); font-size:0.9rem; margin-top:4px; }
    .profile-meta { display:flex;gap:20px;margin-top:10px;flex-wrap:wrap; }
    .profile-meta span { font-size:0.82rem; color:rgba(255,255,255,0.5); display:flex;align-items:center;gap:5px; }
    .profile-content { padding: 40px 0; }
    .profile-grid { display:grid;grid-template-columns:1fr 360px;gap:28px; }
    .section-card { background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px; }
    .section-card h3 { font-weight:700;font-size:1rem;color:var(--ink);margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--cream-dark); }
    .profile-field { display:grid;grid-template-columns:140px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--cream-dark); }
    .profile-field:last-child { border-bottom:none; }
    .profile-field label { font-size:0.8rem;font-weight:600;color:var(--muted);letter-spacing:0.04em;text-transform:uppercase;padding-top:2px; }
    .profile-field span { font-size:0.9rem;color:var(--ink); }
    @media(max-width:768px){ .profile-grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<script src="./navbar.js"></script>
<script>injectNavbar('');</script>

<div class="page-content">
  <!-- Hero -->
  <div class="profile-hero">
    <div class="container">
      <div class="profile-header">
        <div class="profile-avatar-large" id="profile-avatar">?</div>
        <div class="profile-info">
          <h1 id="profile-name">Loading…</h1>
          <p id="profile-email">—</p>
          <div class="profile-meta">
            <span id="profile-role-badge"></span>
            <span id="profile-location-badge"></span>
            <span id="profile-phone-badge"></span>
          </div>
        </div>
        <div style="margin-left:auto;">
          <button class="btn btn-primary" id="edit-btn">Edit Profile</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="profile-content">
    <div class="container">
      <div class="profile-grid">
        <!-- Left: details -->
        <div>
          <div class="section-card">
            <h3>Personal Information</h3>
            <div class="profile-field"><label>Full Name</label><span id="d-name">—</span></div>
            <div class="profile-field"><label>Email</label><span id="d-email">—</span></div>
            <div class="profile-field"><label>Role</label><span id="d-role">—</span></div>
            <div class="profile-field"><label>Phone</label><span id="d-phone">—</span></div>
            <div class="profile-field"><label>Location</label><span id="d-location">—</span></div>
            <div class="profile-field"><label>Date of Birth</label><span id="d-dob">—</span></div>
          </div>

          <div class="section-card">
            <h3>Skills</h3>
            <div id="d-skills" class="skills-list"><span style="color:var(--muted);font-size:0.875rem;">No skills listed yet.</span></div>
          </div>
        </div>

        <!-- Right: password change + quick actions -->
        <div>
          <div class="section-card">
            <h3>Change Password</h3>
            <div id="pw-alert"></div>
            <form id="pw-form" novalidate style="display:flex;flex-direction:column;gap:14px;">
              <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" id="current-pass" class="form-input" placeholder="Your current password" />
              </div>
              <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" id="new-pass" class="form-input" placeholder="Min. 6 characters" />
              </div>
              <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" id="confirm-pass" class="form-input" placeholder="Re-enter new password" />
              </div>
              <button type="submit" class="btn btn-primary w-full" id="pw-btn">Update Password</button>
            </form>
          </div>

          <div class="section-card">
            <h3>Quick Links</h3>
            <div style="display:flex;flex-direction:column;gap:8px;">
              <a href="./dashboard.html" class="btn btn-outline w-full">Go to Dashboard</a>
              <a href="./mentors.html" class="btn btn-outline w-full">Browse Mentors</a>
              <a href="./become-mentor.html" class="btn btn-outline w-full" id="mentor-link">Become a Mentor</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Edit Profile Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal" style="max-width:580px;">
    <div class="modal-header">
      <span class="modal-title">Edit Profile</span>
      <button class="modal-close" id="close-modal">✕</button>
    </div>
    <div id="edit-alert"></div>
    <form id="edit-form" novalidate style="display:flex;flex-direction:column;gap:16px;">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="e-name" class="form-input" placeholder="Your name" />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="e-email" class="form-input" placeholder="Email" />
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="tel" id="e-phone" class="form-input" placeholder="+91 98765 43210" />
        </div>
        <div class="form-group">
          <label class="form-label">Date of Birth</label>
          <input type="date" id="e-dob" class="form-input" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Location</label>
        <input type="text" id="e-location" class="form-input" placeholder="City, State" />
      </div>
      <div class="form-group">
        <label class="form-label">Skills <span style="font-weight:400;text-transform:none;letter-spacing:0;">(comma-separated)</span></label>
        <input type="text" id="e-skills" class="form-input" placeholder="Java, Spring Boot, React" />
        <span class="form-hint">e.g. Java, Spring Boot, MySQL, React</span>
      </div>
      <button type="submit" class="btn btn-primary w-full btn-lg" id="edit-save-btn">Save Changes</button>
    </form>
  </div>
</div>

<script src="./app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!requireRole()) return;

  const user = Auth.get();
  renderProfile(user);

  // Refresh from server
  const { ok, data } = await apiFetch(`/auth/profile/${encodeURIComponent(user.email)}`);
  if (ok && data.success) {
    Auth.save(data.data);
    renderProfile(data.data);
  }

  function renderProfile(u) {
    document.getElementById('profile-avatar').textContent = initials(u.name);
    document.getElementById('profile-name').textContent = u.name || '—';
    document.getElementById('profile-email').textContent = u.email || '—';
    document.getElementById('d-name').textContent = u.name || '—';
    document.getElementById('d-email').textContent = u.email || '—';
    document.getElementById('d-role').innerHTML = `<span class="badge badge-amber">${u.role}</span>`;
    document.getElementById('d-phone').textContent = u.phone || '—';
    document.getElementById('d-location').textContent = u.location || '—';
    document.getElementById('d-dob').textContent = u.dob ? fmtDate(u.dob) : '—';

    document.getElementById('profile-role-badge').innerHTML = `<span class="badge badge-amber" style="font-size:0.72rem;">${u.role}</span>`;
    if (u.location) document.getElementById('profile-location-badge').textContent = `📍 ${u.location}`;
    if (u.phone) document.getElementById('profile-phone-badge').textContent = `📞 ${u.phone}`;

    const skillsEl = document.getElementById('d-skills');
    if (u.skills) {
      skillsEl.innerHTML = u.skills.split(',').map(s => `<span class="skill-chip">${s.trim()}</span>`).join('');
    }

    // Hide "become mentor" link if already mentor
    if (u.role === 'MENTOR' || u.role === 'ADMIN') {
      document.getElementById('mentor-link').style.display = 'none';
    }
  }

  // Edit modal
  document.getElementById('edit-btn').addEventListener('click', () => {
    const u = Auth.get();
    document.getElementById('e-name').value = u.name || '';
    document.getElementById('e-email').value = u.email || '';
    document.getElementById('e-phone').value = u.phone || '';
    document.getElementById('e-location').value = u.location || '';
    document.getElementById('e-dob').value = u.dob || '';
    document.getElementById('e-skills').value = u.skills || '';
    document.getElementById('edit-modal').classList.add('open');
  });
  document.getElementById('close-modal').addEventListener('click', () => document.getElementById('edit-modal').classList.remove('open'));
  document.getElementById('edit-modal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('edit-modal')) document.getElementById('edit-modal').classList.remove('open');
  });

  // Save profile
  document.getElementById('edit-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertEl = document.getElementById('edit-alert');
    alertEl.innerHTML = '';
    const u = Auth.get();
    const payload = {
      name:     document.getElementById('e-name').value.trim() || undefined,
      email:    document.getElementById('e-email').value.trim() || undefined,
      phone:    document.getElementById('e-phone').value.trim() || undefined,
      location: document.getElementById('e-location').value.trim() || undefined,
      dob:      document.getElementById('e-dob').value || undefined,
      skills:   document.getElementById('e-skills').value.trim() || undefined,
    };
    const btn = document.getElementById('edit-save-btn');
    setLoading(btn, true);
    const { ok, data } = await apiFetch(`/auth/profile/${encodeURIComponent(u.email)}`, {
      method: 'PATCH', body: JSON.stringify(payload)
    });
    setLoading(btn, false, 'Save Changes');
    if (ok && data.success) {
      Auth.save(data.data);
      renderProfile(data.data);
      document.getElementById('edit-modal').classList.remove('open');
      Toast.success('Profile updated!');
    } else {
      alertEl.innerHTML = `<div class="alert alert-error mb-16">⚠ ${data.message || 'Update failed.'}</div>`;
    }
  });

  // Change password
  document.getElementById('pw-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertEl = document.getElementById('pw-alert');
    alertEl.innerHTML = '';
    const u = Auth.get();
    const currentPassword = document.getElementById('current-pass').value;
    const newPassword     = document.getElementById('new-pass').value;
    const confirmPw       = document.getElementById('confirm-pass').value;

    if (!currentPassword || !newPassword) { alertEl.innerHTML = `<div class="alert alert-error mb-16">All fields are required.</div>`; return; }
    if (newPassword.length < 6) { alertEl.innerHTML = `<div class="alert alert-error mb-16">New password must be at least 6 characters.</div>`; return; }
    if (newPassword !== confirmPw) { alertEl.innerHTML = `<div class="alert alert-error mb-16">Passwords do not match.</div>`; return; }

    const btn = document.getElementById('pw-btn');
    setLoading(btn, true);
    const { ok, data } = await apiFetch(`/auth/profile/${encodeURIComponent(u.email)}`, {
      method: 'PATCH', body: JSON.stringify({ currentPassword, newPassword })
    });
    setLoading(btn, false, 'Update Password');
    if (ok && data.success) {
      Toast.success('Password updated!');
      document.getElementById('pw-form').reset();
      alertEl.innerHTML = `<div class="alert alert-success mb-16">✓ Password changed successfully!</div>`;
    } else {
      alertEl.innerHTML = `<div class="alert alert-error mb-16">⚠ ${data.message || 'Failed.'}</div>`;
    }
  });
});
</script>
</body>
</html>
