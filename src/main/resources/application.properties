# ================================================================
# KAUSHALYA — Spring Boot Application Configuration
# ================================================================

spring.application.name=Kaushalya

# ── Server ───────────────────────────────────────────────────────
server.port=8080

# ── Active Profile ───────────────────────────────────────────────
# Change to 'prod' only when your local MySQL is running
spring.profiles.active=dev

# ================================================================
# DEV PROFILE — H2 Persistent File Database
# ================================================================
# Data is now saved in a local file so it PERSISTS after restart
# ── JPA / Hibernate ──────────────────────────────────────────────
# 'update' ensures tables are created/modified without deleting data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================================================================
# PROD PROFILE — MySQL
# ================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/kaushalya?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=atharv
spring.datasource.password=atharv
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ── Logging ──────────────────────────────────────────────────────
logging.level.com.kaushalya=INFO
logging.level.org.springframework.security=WARN